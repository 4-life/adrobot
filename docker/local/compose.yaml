name: adrobot-local

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: "../../.env"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: schema migrations - and the build of the backend image `api` reuses.
  migrate:
    image: adrobot-local-backend:latest
    build:
      context: ../../backend
      target: runner
    env_file: "../../.env"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: adrobot-local-backend:latest
    pull_policy: never
    restart: unless-stopped
    env_file: "../../.env"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"  # this machine only, not the network
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build: ../../dashboard
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"  # this machine only, not the network

volumes:
  postgres_data:
