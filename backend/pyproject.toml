[project]
name = "adrobot-backend"
version = "0.1.0"
description = "AdRobot backend: Keitaro campaign and offer manager"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "alembic==1.20.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    # Starlette's TestClient transport (plain httpx there is deprecated).
    "httpx2==2.16.2",
    "datamodel-code-generator==0.84.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Generated by scripts/gen-keitaro.sh (formatted there, never linted or hand-edited).
extend-exclude = ["app/tracker/keitaro/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves relationship annotations at class creation: forward refs must stay quoted.
"app/models/*" = ["UP037"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Generated code: checked where it's used (models_overrides.py, client.py), not inside.
module = ["app.tracker.keitaro.models"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
